name: Release & Update README

on:
  pull_request:
    types: [ closed ]
    branches: [ main ]

jobs:
  release-automation:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main 

      - name: Fetch Chuck Norris Joke
        id: joke
        run: |
          JOKE=$(curl -s https://api.chucknorris.io/jokes/random | jq -r '.value')
          echo "joke=$JOKE" >> $GITHUB_OUTPUT

      - name: Update README.md
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          JOKE="${{ steps.joke.outputs.joke }}"
          
          sed -i '//q' README.md
          echo -e "\n## Latest Release Info" >> README.md
          echo "- **Version:** $VERSION" >> README.md
          echo "- **PR Title:** $PR_TITLE" >> README.md
          echo "- **Chuck Norris Joke:** $JOKE" >> README.md

      - name: Commit and Push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: auto-update release info in README [skip ci]"
          git push

      - name: Create GitHub Release and Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          JOKE="${{ steps.joke.outputs.joke }}"
          
          gh release create $VERSION \
            --title "Release $VERSION" \
            --notes "Merged PR: ${{ github.event.pull_request.title }}
            
            🤖 Fun Fact: $JOKE"